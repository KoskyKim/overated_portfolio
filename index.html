<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVERRATED.pix — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--fg:#0E0E0E;--mut:#5b574e;--ln:#d6d0c2;--a:#FF4D1C;--l:#D7FF3D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1033;--fg:#F6F1FF;--mut:#bdb0da;--ln:#35285c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1033;--fg:#F6F1FF;--mut:#bdb0da;--ln:#35285c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
h1,h2,b.d{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;line-height:.88;letter-spacing:-.02em;margin:0}
a{color:inherit}.mut{color:var(--mut)}
header{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) 4vw 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font:400 30px/1 'Instrument Serif',Georgia,serif;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.links{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.links a{text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap;position:relative}
.links a::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:var(--a);transition:width .3s}
.links a:hover::after,.links a.on::after{width:100%}
.btn{display:inline-block;padding:15px 30px;border-radius:99px;border:2px solid currentColor;font:700 15px 'DM Sans',sans-serif;text-decoration:none;background:none;color:inherit;cursor:pointer;transition:transform .3s,background .3s,color .3s}
.btn:hover{background:#0E0E0E;color:#fff;transform:scale(1.06)}
.btn.f{background:#0E0E0E;color:#fff}.btn.f:hover{background:var(--a);color:#0E0E0E}
header .btn{padding:9px 20px}
@media(max-width:860px){header .btn{display:none}}
#wipe{position:fixed;inset:0;background:var(--a);z-index:90;transform:translateY(100%);pointer-events:none}
#cur{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--a);pointer-events:none;z-index:99;display:grid;place-items:center;font:700 12px 'DM Sans',sans-serif;color:#0E0E0E;transition:width .3s,height .3s,margin .3s}
#cur.big{width:92px;height:92px;margin:-46px}#cur span{opacity:0;transition:opacity .2s}#cur.big span{opacity:1}
@media(hover:none){#cur{display:none}}
#pv{position:fixed;left:0;top:0;width:220px;height:150px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:60;display:grid;place-items:center;font:700 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0E0E0E}
#pv.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#0E0E0E;color:#fff;padding:14px 22px;border-radius:99px;z-index:95;transition:transform .4s cubic-bezier(.2,.8,.2,1);font-weight:500}
#toast.on{transform:translate(-50%,0)}
.ph{display:grid;place-items:center;color:#0E0E0E;font:700 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;border-radius:14px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ph span{opacity:.6}.ph:hover{transform:scale(1.03) rotate(-1deg)}
.up i{display:inline-block;font-style:normal;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*55ms + 250ms)}
@keyframes up{to{transform:none}}
.it,.it i{font-style:italic;color:var(--a)}
.cta .it,.cta .it i{color:#0E0E0E}
.w{display:block;overflow:hidden;padding:.04em 0 .16em;margin-bottom:-.12em}
[data-r]{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
[data-r].in{opacity:1;transform:none}
.sec{padding:clamp(56px,9vw,120px) 4vw}
.h2{font-size:clamp(52px,9.5vw,140px);margin-bottom:32px}
.hero{position:relative;min-height:100svh;padding:0 4vw 3vw;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.fl{position:absolute;rotate:var(--r);transition:translate .5s ease-out}
.mega{font-size:clamp(76px,22vw,350px)}
.side{position:absolute;right:4vw;bottom:4vw;display:flex;align-items:center;gap:24px;text-align:right}
.reel{width:120px;height:120px;border-radius:50%;border:2px solid var(--fg);background:var(--l);color:#0E0E0E;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:transform .4s}
.reel:hover{transform:scale(1.15) rotate(-8deg)}
@media(max-width:700px){.side{position:static;margin-top:20px;justify-content:space-between;text-align:left}}
.mq{overflow:hidden;background:var(--l);color:#0E0E0E;padding:18px 0}
.tr{display:flex;width:max-content;animation:mq 28s linear infinite}
.tr span{font:italic 400 clamp(40px,5.5vw,72px)/1 'Instrument Serif',Georgia,serif;padding-right:36px}
.tr span::after{content:" /";color:#0E0E0E;padding-left:36px}
@keyframes mq{to{transform:translateX(-50%)}}
.ccs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.cc{display:flex;flex-direction:column;justify-content:space-between;min-height:460px;padding:24px;border-radius:22px;color:#0E0E0E;text-decoration:none;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cc:hover{transform:translateY(-12px) rotate(-1.2deg)}
.cc .t{font:400 clamp(52px,6.5vw,90px)/.9 'Instrument Serif',Georgia,serif;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:flex-start;font-weight:700}
.ar{width:52px;height:52px;border:2px solid;border-radius:50%;display:grid;place-items:center;font-size:22px;transition:.4s}
.cc:hover .ar,.fc:hover .ar{transform:rotate(45deg);background:#0E0E0E;color:#fff}
.fc{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:28px;border-radius:22px;text-decoration:none}
.fc .t{font:400 clamp(52px,9vw,120px)/.9 'Instrument Serif',Georgia,serif;letter-spacing:-.02em}
.fc .fr{display:flex;gap:10px}
.fc i{width:80px;height:120px;border-radius:8px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.fc:hover i:nth-child(odd){transform:translateY(-18px)}.fc:hover i:nth-child(even){transform:translateY(18px)}
.mas{columns:4 220px;column-gap:14px}.mas>*{break-inside:avoid;margin-bottom:14px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--ln);cursor:pointer;transition:padding .4s,color .3s}
.rw:hover{padding-left:24px;color:var(--a)}
.rw b{font:400 clamp(34px,5.5vw,72px)/1 'Instrument Serif',Georgia,serif}.rw:hover b{font-style:italic}
.rw em{font-style:normal;color:var(--mut);font-size:14px;margin-right:24px}.rw small{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px}
.stats b{display:block;font:italic 400 clamp(72px,11vw,160px)/1 'Instrument Serif',Georgia,serif}
.cta{background:var(--l);color:#0E0E0E;text-align:center}
.cta .big{font-size:clamp(84px,21vw,340px);margin:0 0 28px}
.px{display:inline-block;font-style:normal;transition:translate .3s}
.ch{padding:calc(120px + env(safe-area-inset-top,0px)) 4vw 40px}
.ch .big{font-size:clamp(76px,20vw,320px);margin:12px 0 24px}
.lead{max-width:520px;font-size:19px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{border:2px solid var(--fg);background:none;color:var(--fg);padding:8px 18px;border-radius:99px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:.25s}
.chip:hover{transform:translateY(-3px)}.chip.on{background:var(--fg);color:var(--bg)}
.feat{min-height:62vh;border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;color:#0E0E0E;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.feat:hover{transform:scale(1.01)}.feat h2{font-size:clamp(52px,9vw,140px)}.feat .ring{align-self:flex-end;width:96px;height:96px;border:2px solid;border-radius:50%;display:grid;place-items:center;font-weight:700}
.nx{display:block;padding:80px 4vw;text-decoration:none}
.nx b{display:block;font:italic 400 clamp(64px,15vw,240px)/.9 'Instrument Serif',Georgia,serif;transition:transform .6s cubic-bezier(.2,.8,.2,1),color .3s}
.nx:hover b{transform:translateX(3vw)}
.fh{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4vw 4vw;overflow:hidden}

.fh>*{position:relative}.fh .big{font-size:clamp(64px,17vw,280px)}
.fh .reel{position:absolute;right:4vw;top:50%;width:130px;height:130px}
@keyframes beam{to{transform:translate(-8%,6%) scale(1.2)}}
.bk{position:relative;overflow:hidden;color:#0E0E0E;background:linear-gradient(135deg,#FF4D1C,#C9A7FF 58%,#7AA2FF)}
.bk::before{content:"";position:absolute;inset:-12%;filter:blur(10px);animation:beam 10s ease-in-out infinite alternate;background:radial-gradient(circle at 14% 24%,rgba(255,255,255,.6) 0 6%,transparent 6.5%),radial-gradient(circle at 80% 18%,rgba(215,255,61,.9) 0 9%,transparent 9.5%),radial-gradient(circle at 62% 72%,rgba(255,138,216,.85) 0 12%,transparent 12.5%),radial-gradient(circle at 28% 82%,rgba(122,162,255,.9) 0 8%,transparent 8.5%),radial-gradient(circle at 92% 86%,rgba(255,255,255,.45) 0 5%,transparent 5.5%),radial-gradient(circle at 46% 38%,rgba(255,216,77,.8) 0 7%,transparent 7.5%)}
.bk>*{position:relative}
.rail{display:flex;gap:20px;overflow-x:auto;padding:0 4vw 20px;scroll-snap-type:x proximity;cursor:grab;scrollbar-width:none;user-select:none}
.poster{flex:0 0 min(70vw,280px);scroll-snap-align:start;transition:transform .2s}
.poster b{display:block;margin-top:12px;font-size:18px}
footer{padding:32px 4vw;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--mut);border-top:1px solid var(--ln)}
html{-webkit-text-size-adjust:100%}
.bur{display:none;width:44px;height:44px;border:2px solid var(--fg);border-radius:50%;background:none;cursor:pointer;position:relative;padding:0}
.bur i{position:absolute;left:11px;right:11px;height:2px;background:var(--fg);transition:transform .3s,top .3s}
.bur i:first-child{top:15px}.bur i:last-child{top:23px}
header.open .bur i:first-child{top:19px;transform:rotate(45deg)}header.open .bur i:last-child{top:19px;transform:rotate(-45deg)}
.mob{display:none}
@media(max-width:860px){
header{backdrop-filter:none;background:var(--bg)}
.bur{display:block}
.links{position:fixed;inset:0;z-index:-1;flex-direction:column;justify-content:center;gap:4px;padding:calc(84px + env(safe-area-inset-top,0px)) 8vw 40px;background:var(--bg);transform:translateY(-100%);transition:transform .5s cubic-bezier(.7,0,.2,1)}
header.open .links{transform:none}
.links a{font:400 clamp(44px,13vw,72px)/1.05 'Instrument Serif',Georgia,serif;letter-spacing:-.02em}
.links a::after{display:none}.links a.on{font-style:italic;color:var(--a)}
.links .mob{display:block;font-style:italic;color:var(--a)}
}
@media(max-width:700px){
.fl{width:30vw!important}.fl .ph{height:auto!important;aspect-ratio:3/4}
.mas{columns:2;column-gap:10px}.mas>*{margin-bottom:10px}
.stats{grid-template-columns:1fr 1fr}
.rw{flex-direction:column;align-items:flex-start;gap:4px}
.fc i{width:56px;height:84px}.fc .fr{gap:6px}
.fh .reel{width:92px;height:92px;top:28%}
.cta .btn{margin:6px 0}
.feat{min-height:52vh}.cc{min-height:340px}
}
@media(hover:none){#pv{display:none}.fl .ph{animation:bob 5s ease-in-out infinite alternate}}
@keyframes bob{to{transform:translateY(-12px) rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}[data-r]{opacity:1;transform:none}.up i{transform:none}}
</style>
</head>
<body>
<div id="wipe"></div><div id="cur"><span></span></div><div id="pv"></div><div id="toast"></div>
<header>
<a class="logo" href="#home">Overrated<span class="it">.pix</span></a>
<nav class="links"><a href="#events">Events</a><a href="#concerts">Concerts</a><a href="#weddings">Weddings</a><a href="#filmography">Filmography</a><a href="#" data-toast="The client portal opens here in the real site">Client portal</a><a class="mob" href="#" data-toast="The booking form opens here in the real site">Book a shoot</a></nav>
<a class="btn f" href="#" data-toast="The booking form opens here in the real site">Book a shoot</a>
<button class="bur" aria-label="Menu" aria-expanded="false"><i></i><i></i></button></header>
<main id="app"></main>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const PAL=[['#FF4D1C','#FFB199'],['#D7FF3D','#8EDB2E'],['#C9A7FF','#7AA2FF'],['#7AA2FF','#D7FF3D'],['#FF8AD8','#FF4D1C']];
const bg=i=>`linear-gradient(${135+i*37}deg,${PAL[i%5][0]},${PAL[i%5][1]})`;
const ph=(h,i,l='Photo')=>`<div class="ph" style="height:${h}px;background:${bg(i)}"><span>${l}</span></div>`;
const L=(s,c='')=>[...s].map((ch,i)=>`<i class="${c}" style="--i:${i}">${ch===' '?'&nbsp;':ch}</i>`).join('');
const CATS={
events:{n:'01 / 03',t:'Events',o:0,intro:'Conferences, launches, festivals and brand activations, covered like a story from the first guest to the last light.',chips:['Corporate','Festivals','Launches','Private'],feat:['Wimbi la Sanaa 2026','Event coverage · Mombasa'],next:'concerts'},
concerts:{n:'02 / 03',t:'Concerts',o:2,intro:'Stage, crowd and the moment between songs. Fast, low-light work for artists, promoters and festivals.',chips:['Festivals','Club nights','Artists','Backstage'],feat:['MOR Festival 2026','Concert coverage · Live'],next:'weddings'},
weddings:{n:'03 / 03',t:'Weddings',o:4,intro:'Quiet moments, loud dance floors and everything between. Photo and film for the day you only get once.',chips:['Ceremony','Portraits','Details','Reception'],feat:['[Couple names]','Wedding · [Location]'],next:'filmography'}};
const clients=[['United Nations','Documentary · Event'],['Mastercard Foundation','Event'],['HEVA Fund','Event'],['Chini ya Mnazi','Graphic design · Event'],['SukumaWiki','Event videography'],['Shira na Marafiki','Event videography'],['Alliance Française','Event']];
const films=[['2026','[Short film title]','Short film','12 min'],['2025','[Documentary title]','Documentary','24 min'],['2025','[Music video title]','Music video','4 min'],['2024','[Short film title two]','Short film','9 min'],['2024','[Documentary title two]','Documentary','31 min']];
const foot=()=>`<footer><span>© 2026 OVERRATED.pix · Mombasa, Kenya</span><span>adams@muricho.com · Instagram · Pinterest · WhatsApp</span><span>Prototype · placeholder images</span></footer>`;
const home=()=>`
<section class="hero"><div>${[[4,9,150,190,-6,0],[26,5,190,130,4,1],[50,11,150,200,-3,2],[70,6,170,130,6,3],[83,32,130,170,-5,4]].map(([x,y,w,h,r,i])=>`<div class="fl" data-p="${(i+1)*8}" style="left:${x}%;top:${y}%;width:${w}px;--r:${r}deg">${ph(h,i)}</div>`).join('')}</div>
<h1 class="mega up"><span class="w">${L('Overrated')}</span><span class="w it">${L('.pix')}</span></h1>
<div class="side"><div><b>Bringing your story to life</b><br><span class="mut">Photography | Videography | Graphic design</span></div><button class="reel" data-cur="PLAY" data-toast="The showreel plays here in the real site">PLAY<br>REEL</button></div></section>
<div class="mq"><div class="tr">${'<span>Events</span><span>Concerts</span><span>Weddings</span><span>Filmography</span>'.repeat(4)}</div></div>
<section class="sec"><h2 class="h2" data-r>Pick your <span class="it">story</span></h2><div class="ccs">${['events','concerts','weddings'].map((k,i)=>{const c=CATS[k];return `<a class="cc" href="#${k}" data-cur="VIEW" data-r style="--d:${i*120}ms;background:${bg(c.o)}"><div class="top"><span>${c.n.slice(0,2)}</span><span class="ar">↗</span></div><div class="t">${c.t}</div></a>`}).join('')}</div>
<a class="fc bk" href="#filmography" data-cur="WATCH" data-r><div><div style="opacity:.75">04 · Short films · Documentaries · Music videos</div><div class="t">Filmography</div></div><div class="fr">${[0,1,2,3].map(i=>`<i style="background:${bg(i+1)}"></i>`).join('')}</div><span class="ar">↗</span></a></section>
<section class="sec" style="padding-top:0"><h2 class="h2" data-r>The <span class="it">highlights</span></h2><div class="mas">${[300,220,360,260,330,240,380,280,230,340,270,310].map((h,i)=>`<div data-r style="--d:${(i%4)*90}ms" data-cur="VIEW">${ph(h,i)}</div>`).join('')}</div></section>
<section class="sec" style="padding-top:0"><h2 class="h2" data-r>Our <span class="it">clients</span></h2>${clients.map((c,i)=>`<div class="rw" data-pv="${i}" data-l="${c[0]}" data-r><div><em>[ 0${i+1} ]</em><b>${c[0]}</b></div><small>${c[1]}</small></div>`).join('')}</section>
<section class="sec stats bk">${[['72','+','Projects done'],['7','+','Years behind the lens'],['32','+','Happy clients'],['9','','Partners']].map(s=>`<div><b><span class="cnt" data-n="${s[0]}">0</span>${s[1]}</b>${s[2]}</div>`).join('')}</section>
<section class="sec cta"><h2 class="big">${L('Ready to','px')}<br><span class="it">${L('create?','px')}</span></h2><a class="btn f" href="#" data-toast="The booking form opens here in the real site">Book a shoot</a> <a class="btn" href="#" data-toast="WhatsApp opens here in the real site">WhatsApp us</a></section>${foot()}`;
const cat=k=>{const c=CATS[k];return `<section class="ch"><small class="mut">${c.n}</small><h1 class="big up"><span class="w">${L(c.t)}</span></h1><p class="lead">${c.intro}</p><div class="chips">${['All',...c.chips].map((x,i)=>`<button class="chip${i?'':' on'}" data-f="${x}">${x}</button>`).join('')}</div></section>
<section class="sec" style="padding-top:0"><div class="feat" data-cur="VIEW" style="background:${bg(c.o)}"><small><b>FEATURED STORY</b></small><div><h2>${c.feat[0]}</h2><p>${c.feat[1]}</p></div><div class="ring">VIEW</div></div></section>
<section class="sec" style="padding-top:0"><div class="mas">${[300,220,360,260,320,240,380,280,230,340,270,310].map((h,i)=>{const t=c.chips[i%4];return `<div class="g" data-t="${t}" data-r style="--d:${(i%4)*80}ms" data-cur="VIEW">${ph(h,i+c.o,t)}</div>`}).join('')}</div></section>
<a class="nx bk" href="#${c.next}"><small>NEXT UP</small><b>${c.next}</b></a>${foot()}`};
const film=()=>`<section class="fh bk"><small>04 / 04</small><h1 class="big up"><span class="w">${L('Filmography')}</span></h1><p style="font-size:20px">Short films · Documentaries · Music videos</p><button class="reel" data-cur="PLAY" data-toast="Cinema mode opens here in the real site">PLAY</button></section>
<section class="sec" style="padding-bottom:40px"><h2 class="h2" data-r>Now <span class="it">showing</span></h2></section>
<div class="rail">${[0,1,2,3,4,5].map(i=>`<div class="poster">${ph(400,i+1,'Poster')}<b>[Film title ${i+1}]</b><span class="mut">${films[i%5][2]} · ${films[i%5][0]}</span></div>`).join('')}</div>
<section class="sec"><h2 class="h2" data-r>The <span class="it">index</span></h2>${films.map((f,i)=>`<div class="rw" data-pv="${i+1}" data-l="Still" data-r><div><em>${f[0]}</em><b>${f[1]}</b></div><small>${f[2]} · ${f[3]}</small></div>`).join('')}</section>
<a class="nx bk" href="#home"><small>THE END? NOT YET</small><b>Back to start</b></a>${foot()}`;
const V={home,events:()=>cat('events'),concerts:()=>cat('concerts'),weddings:()=>cat('weddings'),filmography:film};
const app=$('#app'),wipe=$('#wipe'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let curR=null;
async function nav(r,first){
 r=V[r]?r:'home';if(r===curR)return;
 if(!first){wipe.style.transition='transform .55s cubic-bezier(.7,0,.2,1)';wipe.style.transform='translateY(0)';await sleep(570)}
 curR=r;app.innerHTML=V[r]();scrollTo(0,0);
 $$('.links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+r));
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
 $$('[data-r]').forEach(el=>io.observe(el));
 const cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);const n=+e.target.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1400);e.target.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);else if(n===9)e.target.textContent='09'})(t0)}),{threshold:.5});
 $$('.cnt').forEach(el=>cio.observe(el));
 if(!first){await sleep(80);wipe.style.transform='translateY(-100%)';await sleep(580);wipe.style.transition='none';wipe.style.transform='translateY(100%)'}
}
addEventListener('hashchange',()=>nav(location.hash.slice(1)));
let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,boost=0,last=0,drag=null;
const cur=$('#cur'),pv=$('#pv');
addEventListener('mousemove',e=>{
 mx=e.clientX;my=e.clientY;const t=e.target.closest?e.target:document.body;
 const c=t.closest('[data-cur]');cur.classList.toggle('big',!!c);if(c)cur.firstChild.textContent=c.dataset.cur;
 $$('.fl').forEach(f=>{const p=+f.dataset.p;f.style.translate=`${(mx-innerWidth/2)*p/200}px ${(my-innerHeight/2)*p/200}px`});
 const row=t.closest('[data-pv]');pv.classList.toggle('on',!!row);
 if(row){const i=+row.dataset.pv;pv.style.background=bg(i);pv.textContent=row.dataset.l;pv.style.transform=`translate(${mx+24}px,${my-70}px) rotate(${-6+(i%3)*5}deg)`}
 const ps=t.closest('.poster');$$('.poster').forEach(q=>{if(q!==ps)q.style.transform=''});
 if(ps){const b=ps.getBoundingClientRect(),x=(mx-b.left)/b.width-.5,y=(my-b.top)/b.height-.5;ps.style.transform=`perspective(700px) rotateY(${x*16}deg) rotateX(${-y*16}deg) scale(1.03)`}
 $$('.px').forEach(l=>{const b=l.getBoundingClientRect(),dx=b.left+b.width/2-mx,dy=b.top+b.height/2-my,d=Math.hypot(dx,dy);l.style.translate=d<220?`${dx/d*(1-d/220)*50}px ${dy/d*(1-d/220)*50}px`:'none'});
});
addEventListener('scroll',()=>{boost=Math.min(12,boost+Math.abs(scrollY-last)/5);last=scrollY},{passive:true});
(function loop(){cx+=(mx-cx)*.2;cy+=(my-cy)*.2;cur.style.transform=`translate(${cx}px,${cy}px)`;boost*=.94;const a=$('.tr')?.getAnimations()[0];if(a)a.playbackRate=1+boost;requestAnimationFrame(loop)})();
addEventListener('pointerdown',e=>{const r=e.target.closest('.rail');if(r)drag={r,x:e.clientX,s:r.scrollLeft}});
addEventListener('pointermove',e=>{if(drag)drag.r.scrollLeft=drag.s-(e.clientX-drag.x)});
addEventListener('pointerup',()=>drag=null);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)};
addEventListener('click',e=>{
 const bu=e.target.closest('.bur');if(bu){const h=bu.parentElement;h.classList.toggle('open');bu.setAttribute('aria-expanded',h.classList.contains('open'));document.body.style.overflow=h.classList.contains('open')?'hidden':''}
 if(e.target.closest('.links a')){$('header').classList.remove('open');document.body.style.overflow=''}
 const tt=e.target.closest('[data-toast]');if(tt){e.preventDefault();toast(tt.dataset.toast)}
 const ch=e.target.closest('.chip');if(ch){$$('.chip').forEach(c=>c.classList.toggle('on',c===ch));$$('.g').forEach(g=>{const s=ch.dataset.f==='All'||g.dataset.t===ch.dataset.f;g.style.display=s?'':'none';if(s)g.animate([{opacity:0,transform:'scale(.88)'},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})})}
});
nav(location.hash.slice(1),true);
</script>
